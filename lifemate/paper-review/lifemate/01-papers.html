ữ liệu gốc"}, {"label": "+7.5K mẫu irrelevance", "detail": "không function nào phù hợp", "new": true}, {"label": "Function masking", "detail": "tên function/tham số → chuỗi ngẫu nhiên", "new": true}, {"label": "SFT Qwen 1.5B / 4B / 7B", "detail": ""}], "key_results": [{"dataset": "BFCL v2", "metric": "Overall acc", "value": "Hammer-4B 76.05; Hammer-1.5B 73.04", "baseline": "xLAM-1.3B-fc 74.90", "src": "Table 2, p.3"}, {"dataset": "API-Bank, Tool-Alpaca, Seal-Tools, Nexus Raven", "metric": "F1 Func+Args (TB)", "value": "Hammer-4B 71.35; Hammer-1.5B 66.20", "baseline": "xLAM-7B-fc 67.65", "src": "Table 3, p.3"}], "recommend": true, "reason": "Đúng cỡ model của cuộc thi và có xử lý irrelevance (tương ứng ca out-of-scope trả []). Tool schema của LifeMate cố định, nên lợi ích của masking cần kiểm lại trên dữ liệu thật [nhận xét của AI].", "_pages": {"roadmap": "chen-2025-hammer/roadmap.html"}}, {"id": "ross-2025-when2call", "title": "When2Call: When (not) to Call Tools", "authors": "Ross, Mahabaleshwarkar, Suhara (NVIDIA)", "venue": "NAACL", "year": 2025, "rank": "A", "flags": [], "direction": "quyết định gọi tool / hỏi lại / từ chối", "url": "https://aclanthology.org/2025.naacl-long.174", "pdf": "pdf/ross-2025-when2call.pdf", "summary": {"problem": "Đánh giá và huấn luyện quyết định khi nào gọi tool, khi nào hỏi thêm thông tin, khi nào nói không làm được với các tool đang có.", "gap": "Benchmark hiện có (kể cả BFCL) chủ yếu chấm gọi đúng tool, đúng tham số. Irrelevance của BFCL và ToolSandbox chỉ kiểm model có gọi tool hay không, không kiểm model làm gì thay vào đó (p.2, Table 1).", "solution": "Benchmark trắc nghiệm 4 lựa chọn (tool call, hỏi lại, không trả lời được, trả lời thẳng) sinh từ BFCL/APIGen. Bộ train đi kèm dùng cho SFT và preference optimization (RPO), với các lựa chọn sai làm mẫu bị từ chối.", "result": "Model chưa train trên When2Call có F1 thấp: Qwen 2.5 3B 29.8, Llama 3.2 3B 17.9. MNM 4B: baseline SFT 29.7 → When2Call-SFT 48.1 → When2Call-RPO 51.0; tool wen2.5-1.5B: Raw 30.65% → GRPO cold start 63.15% (Table 1, p.9).", "problem_short": "Reward cho RL tool-use", "gap_short": "SFT tổng quát kém, reward thô", "solution_short": "GRPO + reward theo tên/tham số/giá trị", "result_short": "Qwen2.5-3B BFCL 51.6 → 67.0"}, "sources": {"problem": "Abstract", "gap": "Abstract, Section 1", "solution": "Section 3", "result": "Table 1, p.9"}, "flow": [{"label": "Rollout nhóm câu trả lời", "detail": "GRPO"}, {"label": "Format reward", "detail": "đúng cấu trúc <think>/<tool_call>"}, {"label": "Correctness reward", "detail": "tên tool + tên tham số + giá trị", "new": true}, {"label": "Cập nhật policy", "detail": "cold start từ instruct model"}], "key_results": [{"dataset": "BFCL v3", "metric": "Overall acc", "value": "Qwen2.5-3B GRPO cold start 67.00%", "baseline": "Raw 51.59%; SFT400 52.76%; SFT400+PPO 65.16%", "src": "Table 1, p.9"}, {"dataset": "BFCL v3", "metric": "Overall acc", "value": "Qwen2.5-1.5B GRPO cold start 63.15%", "baseline": "Raw 30.65%; SFT400 53.60%", "src": "Table 1, p.9"}], "recommend": true, "reason": "Metric LifeMate (khớp tên + tham số, state hash) chuyển thẳng thành reward được, và zaic_tools cho phép tính state reward. Thí nghiệm trên đúng cỡ 1.5B/3B. Chưa qua peer review.", "_pages": {}}, {"id": "peng-2026-spokenfc", "title": "Spoken Function Calling: A New Perspective on Spoken Language Understanding for Large Audio Language Models", "authors": "Peng, Liu, Gao, Gao, Chen, Li, Chen (SJTU, Alibaba)", "venue": "ACM MM", "year": 2026, "rank": "A*", "flags": [], "direction": "function calling từ giọng nói (ASR+LLM vs audio LLM)", "url": "https://github.com/QwenAudio/FunResearch/tree/main/SpokenFC", "pdf": "pdf/peng-2026-spokenfc.pdf", "summary": {"problem": "Thay SLU truyền thống (intent + slot) bằng function calling từ câu nói, và đánh giá LLM, pipeline ASR+LLM, audio LLM trên benchmark mới.", "gap": "SLU truyền thống làm tốt tập đóng sau khi fine-tune trong domain, nhưng định nghĩa intent/slot mơ hồ nên khó d function card(p) {
  const s = p.summary || {}, src = p.sources || {};
  const field = (k, label) => `<div><div class="k">${label} ${src[k] ? `<span class="src">${esc(src[k])}</span>` : ""}</div>${md(s[k])}</div>`;
  return `<article class="card paper" id="p-${esc(p.id)}" data-id="${esc(p.id)}">
    <header>
      <div class="t">
        <h2>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h2>
        <div class="muted small">${esc(p.authors || "")}</div>
        <div class="row" style="margin-top:6px">
          <span class="badge solid">${esc(p.venue)} ${esc(p.year || "")}</span>
          ${p.rank ? `<span class="badge acc">${esc(p.rank)}</span>` : ""}
          ${(p.flags || []).map(f => `<span class="badge ${flagClass(f)}">${esc(f)}</span>`).join("")}
          ${p.direction ? `<span class="badge">${esc(p.direction)}</span>` : ""}
          ${p.pdf ? `<a class="small" href="${esc(p.pdf)}" target="_blank" rel="noopener">PDF</a>` : ""}
          ${p._pages?.roadmap ? `<a class="btn" href="${esc(p._pages.roadmap)}">Roadmap</a>` : ""}
          ${p._pages?.deepDive ? `<a class="btn" href="${esc(p._pages.deepDive)}">Deep dive</a>` : ""}
        </div>
      </div>
      <label class="pick"><input type="checkbox" ${picked.has(p.id) ? "checked" : ""}> Chọn</label>
    </header>
    <div class="grid4">${field("problem", "Bài toán")}${field("gap", "Research gap")}${field("solution", "Solution")}${field("result", "Result")}</div>
    ${p.flow?.length ? `<div class="k small muted" style="margin-top:10px;font-weight:600">Các bước của phương pháp</div>${RP.flow(p.flow)}` : ""}
    ${p.key_results?.length ? RP.table({head: ["Dataset", "Metric", "Paper", "Baseline tốt nhất", "Nguồn"], rows: p.key_results.map(r => [r.dataset, r.metric, r.value, r.baseline || "", r.src || ""])}) : ""}
    ${p.reason ? `<div class="rec">${p.recommend ? "<b>AI đề xuất đọc sâu.</b> " : "<b>AI không đề xuất.</b> "}${md(p.reason).replace(/^<p>|<\/p>$/g, "")}</div>` : ""}
  </article>`;
}

function render() {
  document.getElementById("cards").innerHTML = DATA.papers.map(card).join("");
  document.getElementById("compare").innerHTML = RP.table({
    head: ["", "Paper", "Venue", "Bài toán", "Gap", "Solution", "Kết quả chính"],
    rows: DATA.papers.map(p => [picked.has(p.id) ? "✓" : "", `[${p.title}](#p-${p.id})`, `${p.venue} ${p.year || ""} ${p.rank || ""}`, p.summary?.problem_short || p.summary?.problem || "", p.summary?.gap_short || p.summary?.gap || "", p.summary?.solution_short || p.summary?.solution || "", p.summary?.result_short || p.summary?.result || ""]),
  });
  applyFilter(); sync(); RP.math();
}

function applyFilter() {
  document.querySelectorAll(".paper").forEach(el => {
    const p = DATA.papers.find(x => x.id === el.dataset.id);
    const show = !filter || filter === "Tất cả" || (filter === "Đã chọn" ? picked.has(p.id) : (p.flags || []).includes(filter));
    el.classList.toggle("dim", !show);
  });
}

function sync() {
  document.querySelectorAll(".paper").forEach(el => el.classList.toggle("picked", picked.has(el.dataset.id)));
  document.getElementById("count").textContent = `Đã chọn ${picked.size}`;
  document.getElementById("picked").textContent = [...picked].join(", ");
  RP.store.set(KEY, [...picked]);
}

document.addEventListener("change", e => {
  const art = e.target.closest(".paper");
  if (!art) return;
  e.target.checked ? picked.add(art.dataset.id) : picked.delete(art.dataset.id);
  sync();
});
document.getElementById("filters").addEventListener("click", e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b === e.target));
  applyFilter();
});
const view = c => {
  document.getElementById("cards").style.display = c ? "none" : "";
  document.getElementById("compare").style.display = c ? "block" : "none";
  document.getElementById("vCards").classList.toggle("on", !c);
  document.getElementById("vCompare").classList.toggle("on", c);
  if (c) render();
};
document.getElementById("vCards").onclick = () => view(false);
document.getElementById("vCompare").onclick = () => view(true);
document.getElementById("copy").onclick = e => RP.copy(`Chọn ${picked.size} paper để deep dive: ${[...picked].join(", ")}`, e.target);
window.addEventListener("load", () => RP.math());
render();
</script>
</body>
</html>
